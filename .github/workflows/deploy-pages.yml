name: Deploy Frame Studio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install system FFmpeg with drawtext for backend verification
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Bundle same-origin FFmpeg WASM runtime for static hosting
        run: npm install --no-save --prefer-offline @ffmpeg/ffmpeg@0.12.10 @ffmpeg/core@0.12.10

      - name: Run unit and integration tests
        run: npm test

      - name: Build static GitHub Pages bundle
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
